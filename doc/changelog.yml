  notes: "chore: Update dependencies\ndocs: Upgrading guide and missing features\nfix: legacy classes returntypewillchange\ntest: cover event and debug systems with tests\nfeat: Add Debugging and Event support\nfeat: Implement SMTP TLS Upgrade/Retry strategies\nfeat: Implement new-style authentication interface and methods\nchore: metadata\nfix: Null safety and return type on overrides of builtins\ntest: Cover new library layout with unit tests\nfeat: Implement a PSR-4 version of the library\ntest: Modernize and amend the unit test suite.\nchore: Update metadata for PHP 8.1, add keywords, add more gitignore lines\nstyle: php-cs-fixer\nMerge pull request #4 from Schlue/FRAMEWORK_6_0\nadded __serialize\nDevelopment mode for Smtp-2.0.0alpha4\nReleased Smtp-2.0.0alpha3\nConsolidated composer and unit test upgrades\nMerge pull request #2 from kesselb/upstream/debt/doc-for-smtp-exception\ndocs: update doc for smtp exception\nDevelopment mode for Smtp-1.9.7\nReleased Smtp-1.9.6\n[jan] Allow unencrypted access (nhirokinet@nhiroki.net, PR #1).\nEnable plaintext SMTP access\nUpdate supported PHP versions and configuration names.\nStandardize descriptions.\nAdd chomp character.\nEnable PHP 7.3 CI.\nUpdate package definitions.\nFix getting exit code on PHP 7.2+.\nMark Chuck and Michael as inactive.\npackage.xml must not contain empty <notes> tags.\nCreate CHANGES for all components.\nRegenerate package.xml from changelog.yml.\nBuild changelog.yml from existing changelog(s).\nUpdate .horde.yml with extended information.\nUpdate composer.json.\nEnable 7.2 builds.\nPEAR on 5.6 and 7.0 is fixed.\nUpdate file list\nMove phpunit configuration to base directory.\nIndicate markup language.\nUpdate references to COPYING files.\nUse LICENSE consistently and move to base directory.\nStop flooding #horde channel.\nUse https URLs.\nInstall all dependencies but PECL extensions.\nHopefully this finally fixes Travis builds now.\nAlways discover channel manually, due to Travis bug.\nFix Travis tests.\nAdd Travis configuration and .gitignore files.\nUpdated\nDevelopment mode for Horde_Smtp-1.9.6"
